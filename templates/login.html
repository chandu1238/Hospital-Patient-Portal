<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            min-height: 100vh;
        }

        nav {
            background: #0b6fa4;
            padding: 18px 60px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 420px;
            max-width: 90%;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #0b6fa4;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b6fa4;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #0b6fa4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #095d8a;
        }

        .register-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-text a {
            color: #0b6fa4;
            text-decoration: none;
            font-weight: bold;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0b6fa4;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">🏥 Hospital Portal</div>
    </nav>

    <div class="container">

        <h1>Patient Login</h1>

        <p class="subtitle">
            Login to your patient account
        </p>

        <form method="POST">

            <!-- Email -->
            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <!-- Password -->
            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <!-- Register Link -->
        <p class="register-text">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

        <!-- Back to Home -->
        <a href="{{ url_for('home') }}" class="back">
            ← Back to Home
        </a>

    </div>

</body>
</html>
