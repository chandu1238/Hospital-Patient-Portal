<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            min-height: 100vh;
            color: #333;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: #0b6fa4;
            padding: 18px 60px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 600px;
            max-width: 92%;
            margin: 45px auto;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #0b6fa4;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* =========================
           FORM
        ========================= */

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {

            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus,
        select:focus {

            outline: none;

            border-color: #0b6fa4;
        }

        /* =========================
           BUTTONS
        ========================= */

        .save-btn {

            width: 100%;

            padding: 14px;

            background: #0b6fa4;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 17px;

            cursor: pointer;
        }

        .save-btn:hover {

            background: #095d8a;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #0b6fa4;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {

            text-decoration: underline;
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <div class="logo">
            🏥 Hospital Portal
        </div>

    </nav>


    <!-- =========================
         FORM CONTAINER
    ========================= -->

    <div class="container">


        <h1>
            ✏️ Edit Profile
        </h1>

        <p class="subtitle">
            Update your personal information
        </p>


        <!-- =========================
             EDIT FORM
        ========================= -->

        <form method="POST">


            <!-- NAME -->

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ patient['name'] }}"
                required
            >


            <!-- AGE -->

            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                value="{{ patient['age'] }}"
                min="1"
                max="120"
                required
            >


            <!-- GENDER -->

            <label>
                Gender
            </label>

            <select
                name="gender"
                required
            >

                <option
                    value="Male"
                    {% if patient['gender'] == 'Male' %}
                        selected
                    {% endif %}
                >
                    Male
                </option>

                <option
                    value="Female"
                    {% if patient['gender'] == 'Female' %}
                        selected
                    {% endif %}
                >
                    Female
                </option>

                <option
                    value="Other"
                    {% if patient['gender'] == 'Other' %}
                        selected
                    {% endif %}
                >
                    Other
                </option>

            </select>


            <!-- PHONE -->

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                name="phone"
                value="{{ patient['phone'] }}"
                required
            >


            <!-- EMAIL -->

            <label>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                value="{{ patient['email'] }}"
                required
            >


            <!-- SAVE -->

            <button
                type="submit"
                class="save-btn"
            >
                💾 Save Changes
            </button>


        </form>


        <!-- BACK -->

        <a
            href="{{ url_for('my_profile') }}"
            class="back"
        >
            ← Back to Profile
        </a>


    </div>


</body>

</html>
