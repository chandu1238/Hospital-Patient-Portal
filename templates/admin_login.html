<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 420px;
            max-width: 90%;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #0b6fa4;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #0b6fa4;
        }

        button {
            width: 100%;

            padding: 14px;

            background: #0b6fa4;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 17px;

            cursor: pointer;
        }

        button:hover {
            background: #095d8a;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #0b6fa4;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">
            🏥
        </div>

        <h1>
            Admin Login
        </h1>

        <p class="subtitle">
            Hospital Administration Portal
        </p>

        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                🔐 Admin Login
            </button>

        </form>

        <a
            href="/"
            class="back"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
